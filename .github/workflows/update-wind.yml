name: Update wind data

on:
  schedule:
    # GFS는 00/06/12/18Z에 돌고 공개까지 3~5시간 걸린다 — 각 사이클이 나왔을
    # 법한 시점(04/10/16/22 UTC) 즈음에 맞춰 하루 4번 돈다.
    - cron: "15 4,10,16,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest available GFS cycle
        id: fetch
        run: |
          ref_time=$(./fetch_latest_gfs.sh gfs.grib2)
          echo "ref_time=${ref_time}" >> "$GITHUB_OUTPUT"

      - name: Convert GRIB2 to leaflet-velocity JSON
        run: python convert.py gfs.grib2 docs/wind-global-1deg.json

      - name: Write metadata
        run: |
          printf '{"refTime":"%s","generatedAt":"%s"}\n' \
            "${{ steps.fetch.outputs.ref_time }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            > docs/meta.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/wind-global-1deg.json docs/meta.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update wind data (${{ steps.fetch.outputs.ref_time }})"
          git push

